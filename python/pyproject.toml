[project]
name = "todo-bdd"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "playwright>=1.40"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "layer(name): the layer of the system an acceptance run is driving",
]
